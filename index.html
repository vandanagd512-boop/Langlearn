<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LangLearn — AI-Powered Language Learning</title>
    <meta name="description" content="Next-generation AI-powered language learning platform built for mastery and fluency." />
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 selection:bg-blue-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script>
      // Instantly remove Netlify drawer and feedback badge to preserve mobile layout
      (function() {
        const removeNetlifyWidgets = () => {
          const selectors = [
            '#netlify-feedback-widget',
            '[data-netlify-feedback]',
            'div[class*="netlify-feedback"]',
            'div[class*="netlify-drawer"]',
            'div[class*="feedback-badge"]',
            'iframe[id*="netlify"]',
            'iframe[src*="netlify"]'
          ];
          try {
            document.querySelectorAll(selectors.join(',')).forEach(el => el.remove());
          } catch(e) {}
        };
        setInterval(removeNetlifyWidgets, 400);
        window.addEventListener('DOMContentLoaded', () => {
          removeNetlifyWidgets();
          const obs = new MutationObserver(removeNetlifyWidgets);
          obs.observe(document.body || document.documentElement, { childList: true, subtree: true });
        });
      })();
    </script>
    <script>
      // Register Service Worker with automatic update & controller sync
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
